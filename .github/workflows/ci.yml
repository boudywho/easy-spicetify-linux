name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bash syntax
        run: bash -n spicetify-universal.sh
      - name: ShellCheck
        run: shellcheck spicetify-universal.sh
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
